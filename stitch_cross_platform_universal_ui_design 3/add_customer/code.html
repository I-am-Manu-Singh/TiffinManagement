<main class="flex-1 px-4 py-4 pb-32 space-y-4 overflow-y-auto" data-purpose="customer-form-body">
<!-- Card Container for Form -->
<div class="bg-white rounded-2xl p-5 shadow-soft border border-slate-100 space-y-5">
<!-- Section Header -->
<div class="flex items-center justify-between pb-2 border-b border-slate-100">
<span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Customer Profile</span>
<span class="text-xs text-rose-500 font-medium">* Required fields</span>
</div>
<!-- Full Name -->
<div class="space-y-1.5" data-purpose="form-group-name">
<label class="block text-sm font-semibold text-slate-700" for="fullName">
            Name <span class="text-rose-500">*</span>
</label>
<input class="w-full rounded-xl border-slate-200 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-150" id="fullName" name="fullName" placeholder="Full Name" required="" type="text">
</div>
<!-- Phone Number with Country Code Selector -->
<div class="space-y-1.5" data-purpose="form-group-phone">
<label class="block text-sm font-semibold text-slate-700" for="phoneNumber">
            Phone Number <span class="text-rose-500">*</span>
</label>
<div class="flex rounded-xl border border-slate-200 bg-white focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition overflow-hidden">
<!-- Country Selector Dropdown -->
<div class="flex items-center pl-3 pr-2 bg-slate-50 border-r border-slate-200 cursor-pointer space-x-1">

<span class="inline-flex items-center justify-center w-5 h-3.5 rounded-sm overflow-hidden shadow-xs">
<svg class="w-full h-full object-cover" viewBox="0 0 640 480">
<path d="M0 0h640v160H0z" fill="#f93"></path>
<path d="M0 160h640v160H0z" fill="#fff"></path>
<path d="M0 320h640v160H0z" fill="#128807"></path>
<circle cx="320" cy="240" fill="#008" r="28"></circle>
<circle cx="320" cy="240" fill="#fff" r="24"></circle>
<circle cx="320" cy="240" fill="#008" r="8"></circle>
</svg>
</span>
<svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<input class="w-full border-none py-2.5 px-3 text-sm text-slate-900 placeholder:text-slate-400 focus:ring-0" id="phoneNumber" name="phoneNumber" placeholder="081234 56789" required="" type="tel">
</div>
</div>
<!-- Email Address -->
<div class="space-y-1.5" data-purpose="form-group-email">
<label class="block text-sm font-semibold text-slate-700" for="email">
            Email Address
          </label>
<input class="w-full rounded-xl border-slate-200 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-150" id="email" name="email" placeholder="Email Address" type="email">
</div>
<!-- Password and Confirm Password Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4" data-purpose="form-group-passwords">
<!-- Password -->
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-slate-700" for="password">
              Password <span class="text-rose-500">*</span>
</label>
<div class="relative">
<input class="w-full rounded-xl border-slate-200 bg-white pl-3.5 pr-10 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-150" id="password" name="password" placeholder="Portal Login Password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>

</div>

<!-- Confirm Password -->

<option selected="" value="main">Main Branch</option>
<option value="downtown">Downtown Branch</option>
<option value="westside">Westside Express</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>

<option value="north_sector">North Sector Route</option>

<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>

<div>

</div>
</div>
<!-- Choose Location Button matching screenshot style -->
<button class="w-full py-2.5 px-4 mt-2 rounded-xl border border-primary text-primary font-semibold text-sm flex items-center justify-center space-x-2 bg-white hover:bg-primary-light/40 active:bg-primary-light transition-all shadow-xs" type="button">
<svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 20l-5.447-2.724A2 2 0 013 15.382V5.618a2 2 0 011.447-1.894L9 1m0 19l6-3m-6 3V1m6 16l5.447 2.724A2 2 0 0021 17.618V7.82a2 2 0 00-1.447-1.894L15 4m0 13V4m0 0L9 1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>

<div class="space-y-1.5 pt-1" data-purpose="form-group-trust-limit">
<label class="block text-sm font-semibold text-slate-700" for="trustLimit">

<div class="relative flex rounded-xl border border-slate-200 bg-white focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition overflow-hidden">
<span class="inline-flex items-center px-4 bg-slate-50 text-slate-500 border-r border-slate-200 font-semibold text-sm">

<input class="w-full border-none py-2.5 px-3 text-sm font-medium text-slate-900 focus:ring-0" id="trustLimit" name="trustLimit" required="" type="number" value="0">
</div>
<p class="text-[11px] leading-relaxed text-slate-500 pt-0.5">

</div>

<div class="space-y-2 pt-1" data-purpose="form-group-status">
<label class="block text-sm font-semibold text-slate-700">Status</label>
<div class="flex items-center space-x-6">
<!-- Active option (green checked radio) -->
<label class="inline-flex items-center cursor-pointer space-x-2">
<input checked="" class="w-4 h-4 text-emerald-600 border-slate-300 focus:ring-emerald-500" name="customer_status" type="radio" value="active">
<span class="text-sm font-medium text-slate-800">Active</span>
</label>
<!-- Inactive option -->
<label class="inline-flex items-center cursor-pointer space-x-2">
<input class="w-4 h-4 text-emerald-600 border-slate-300 focus:ring-emerald-500" name="customer_status" type="radio" value="inactive">
<span class="text-sm font-medium text-slate-600">Inactive</span>
</label>
</div>
</div>
